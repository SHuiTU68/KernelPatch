name: Build kpinit / kpramdisk (ramdisk helpers)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ramdisk/**'
      - '.github/workflows/build-kpinit.yml'

jobs:
  build-kpinit:
    name: Build kpinit-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Generate version
        id: parse_version
        run: |
          MAJOR=$(grep '#define MAJOR' version | awk '{print $3}')
          MINOR=$(grep '#define MINOR' version | awk '{print $3}')
          PATCH=$(grep '#define PATCH' version | awk '{print $3}')
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build kpinit + kpramdisk
        run: |
          make -C ramdisk clean
          make -C ramdisk
          file ramdisk/kpinit-android ramdisk/kpramdisk-android
          du -h ramdisk/kpinit-android ramdisk/kpramdisk-android

      - name: Selftest (lz4 legacy + cpio + boot image round trip)
        run: make -C ramdisk check

      - name: Release
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.parse_version.outputs.VERSION }}
          artifacts: ramdisk/kpinit-android,ramdisk/kpramdisk-android
          allowUpdates: true
          replacesArtifacts: true