name: Build kpinit / kpramdisk (ramdisk helpers)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ramdisk/**'
      - '.github/workflows/build-kpinit.yml'

jobs:
  build-kpinit:
    name: Build kpinit-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Generate version
        id: parse_version
        run: |
          MAJOR=$(grep '#define MAJOR' version | awk '{print $3}')
          MINOR=$(grep '#define MINOR' version | awk '{print $3}')
          PATCH=$(grep '#define PATCH' version | awk '{print $3}')
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # bionic, not glibc: a static glibc binary is killed by Android's seccomp
      # filters with SIGSYS, which is what the patcher reports as the classic
      # "Bad system call" when it runs kpramdisk.
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build kpinit + kpramdisk (static bionic)
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make -C ramdisk clean
          make -C ramdisk
          file ramdisk/kpinit-android ramdisk/kpramdisk-android
          du -h ramdisk/kpinit-android ramdisk/kpramdisk-android

      - name: Verify the targets are bionic, not glibc
        run: make -C ramdisk check-android

      - name: Selftest (lz4 legacy + cpio + boot image round trip)
        run: make -C ramdisk check

      - name: Release
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.parse_version.outputs.VERSION }}
          artifacts: ramdisk/kpinit-android,ramdisk/kpramdisk-android
          allowUpdates: true
          replacesArtifacts: true
